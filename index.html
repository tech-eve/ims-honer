<!DOCTYPE html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://unpkg.com/html5-qrcode"></script><title>IMS Inventory</title><style>body{font-family:Inter,ui-sans-serif,system-ui;background:#f4f6fa}.navbtn.active{background:#e9efff;color:#2849b8;font-weight:700}.card{background:white;border:1px solid #e7eaf0;border-radius:16px;box-shadow:0 2px 12px #14203b08}.field{width:100%;border:1px solid #d8deea;border-radius:9px;padding:10px 12px;background:white}.btn{border-radius:9px;padding:10px 14px;font-weight:650}.primary{background:#3158d5;color:white}.muted{background:#edf0f6;color:#334155}.danger{background:#fee2e2;color:#b91c1c}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #eef0f4;white-space:nowrap}th{font-size:12px;text-transform:uppercase;color:#667085}#loading{display:none;position:fixed;inset:0;background:#ffffffb8;z-index:40;align-items:center;justify-content:center}#login{min-height:100vh}main{min-width:0} .tablewrap{overflow:auto}label{font-size:13px;font-weight:600;color:#475467}.audit-toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,auto);gap:.65rem;align-items:center}.audit-code-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.65rem;align-items:stretch}.audit-code-form input,.audit-code-submit{min-height:52px}.audit-code-form input{font-size:16px}.audit-code-submit{white-space:nowrap}.audit-mobile{display:none}.audit-mobile-card{border:1px solid #e5eaf2;border-radius:14px;background:#fff;padding:16px;margin:10px 4px;box-shadow:0 2px 8px #14203b0a}.audit-part-title{display:flex;flex-direction:column;gap:4px;font-size:17px}.audit-part-stock{display:flex;gap:5px;align-items:center;margin:12px 0;color:#475467}.audit-mobile-variance{margin-left:auto;font-weight:700}.audit-count-label{display:block;margin:10px 0 5px}.audit-count-input{height:54px;font-size:22px;font-weight:700;text-align:center}.audit-save-btn,.audit-adjust-btn,.audit-scan-btn,.audit-export-btn{min-height:48px}.audit-save-btn,.audit-adjust-btn{width:100%;margin-top:10px}.admin-delete-list{max-height:52vh;overflow:auto;border:1px solid #e5e7eb;border-radius:10px}.admin-delete-row{display:flex;align-items:flex-start;gap:12px;padding:13px;border-bottom:1px solid #eef0f4;cursor:pointer;text-align:left}.admin-delete-row input{width:22px;height:22px;flex:none;margin-top:2px}.admin-delete-row span{overflow-wrap:anywhere}@media(max-width:640px){.audit-toolbar{grid-template-columns:1fr 1fr}.audit-scan-btn,.audit-export-btn{width:100%;min-height:54px}.audit-desktop{display:none}.audit-mobile{display:block}.audit-mobile-card{margin:10px 0;padding:16px}.audit-count-input{font-size:24px}.admin-delete-list{max-height:58vh}}#scanToast{position:fixed;top:12px;left:50%;transform:translate(-50%,-150%);opacity:0;z-index:70;width:min(92vw,520px);padding:13px 16px;border-radius:14px;background:#15803d;color:white;box-shadow:0 12px 35px #0003;display:flex;flex-direction:column;gap:2px;transition:transform .2s ease,opacity .2s ease;pointer-events:none}#scanToast.show{transform:translate(-50%,0);opacity:1}#scanToast.is-error{background:#fff1f2!important;color:#991b1b;border:2px solid #ef4444}.scan-error-heading{display:flex;align-items:center;gap:10px}.scan-error-icon{width:26px;height:26px;display:inline-grid;place-items:center;border-radius:50%;background:#dc2626;color:#fff;font-size:20px;font-weight:900}#scanToast.is-error small{color:#991b1b}#scanToast b{font-size:14px}#scanToast span{font-size:17px;font-weight:800;overflow-wrap:anywhere}#scanToast small{font-size:12px;color:#dcfce7}.audit-confirm-btn{width:100%;min-height:56px;font-size:17px;font-weight:800}.audit-confirm-btn:disabled{opacity:.45;cursor:not-allowed}.audit-pending-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #eef0f4}.audit-pending-row small{display:block;color:#667085;margin-top:3px}.audit-pending-actions{display:flex;gap:6px;align-items:center}.audit-pending-add,.audit-pending-edit,.audit-remove-btn{min-height:44px;min-width:48px;padding:7px 12px}.scanner-pending{margin-top:12px;padding:10px 12px;border-radius:10px;background:#f1f5f9;color:#1e293b;font-size:13px;line-height:1.45;max-height:118px;overflow:auto}.scanner-pending small{color:#64748b}@media(max-width:640px){.audit-confirm-btn{min-height:60px;font-size:18px}.audit-pending-row{grid-template-columns:minmax(0,1fr) auto;gap:8px}.audit-pending-row{grid-template-columns:minmax(0,1fr);gap:8px}.audit-pending-actions{justify-content:flex-end;flex-wrap:wrap}}
</style></head><body><div id="scanToast" role="status" aria-live="polite" class="scan-toast"></div><div id="loading"><div class="bg-white p-5 rounded-xl shadow font-semibold">Processing…</div></div><section id="login" class="flex items-center justify-center p-5"><div class="card w-full max-w-md p-7"><div class="text-xs font-bold tracking-widest text-blue-700">IMS · INVENTORY MANAGEMENT</div><h1 class="text-3xl font-bold mt-3">Welcome back</h1><p class="text-slate-500 mt-2 mb-6">Sign in to manage parts and service stock.</p><form id="loginForm" class="space-y-4"><div><label>Username</label><input id="username" class="field mt-1" required autocomplete="username"></div><div><label>Password</label><input id="password" type="password" class="field mt-1" required autocomplete="current-password"></div><button class="btn primary w-full">Sign in</button></form></div></section><div id="app" class="hidden min-h-screen"><header class="bg-white border-b px-4 md:px-7 py-4 flex justify-between items-center"><div><b class="text-blue-800">IMS</b><span class="text-slate-500 ml-2 hidden sm:inline">Spare Parts & Service</span></div><div class="flex items-center gap-3"><div id="who" class="text-right text-xs"></div><button id="logout" class="btn muted text-sm">Logout</button></div></header><div class="max-w-7xl mx-auto p-3 md:p-6"><nav class="flex gap-2 overflow-x-auto pb-4" id="nav"></nav><main id="view"></main></div></div><div id="scanner" class="hidden fixed inset-0 bg-black/70 z-50 items-center justify-center p-4"><div class="bg-white p-5 rounded-2xl w-full max-w-md"><div class="flex justify-between mb-3"><b>Scan barcode / QR</b><button class="btn muted" onclick="stopScan()">Close</button></div><div id="reader"></div><div id="scannerPending" class="scanner-pending" aria-live="polite">คิวยังว่าง — เริ่มสแกนสินค้าได้เลย</div></div></div>
<script>
let token=localStorage.getItem('ims_token'), user=null, data=null, chart=null, scanTarget=null;
const auditCounts=Object.create(null);let lastAuditScanCode='',auditCodeArmed=true,auditLastAcceptedAt=0,auditMissCount=0;
const tabs=[['dashboard','Dashboard'],['inventory','Parts Inventory'],['stock','Stock In / Out'],['audit','Stock Audit'],['history','History & Export']];
function busy(on){document.getElementById('loading').style.display=on?'flex':'none'}
async function call(fn,...args){busy(true);try{const response=await fetch('/api/ims',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:fn,args:[token,...args]})});const result=await response.json();if(!response.ok)throw new Error(result.error||'เรียกใช้เซิร์ฟเวอร์ไม่สำเร็จ');return result}catch(e){throw e}finally{busy(false)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function alertErr(e){Swal.fire({icon:'error',title:'Unable to complete',text:e.message||String(e)})}
async function start(){try{data=await call('getAppData');user=data.user;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').innerHTML=`<b>${esc(user.Full_Name)}</b><br>${esc(user.Branch)} · ${esc(user.Role)}`;renderNav();showTab('dashboard')}catch(e){localStorage.removeItem('ims_token');token=null;document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();busy(true);try{const response=await fetch('/api/ims',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',args:[document.getElementById('username').value,document.getElementById('password').value]})});const result=await response.json();if(!response.ok)throw new Error(result.error||'เข้าสู่ระบบไม่สำเร็จ');token=result.token;localStorage.setItem('ims_token',token);await start()}catch(err){alertErr(err)}finally{busy(false)}};
document.getElementById('logout').onclick=async()=>{try{await call('logout')}catch(e){}localStorage.removeItem('ims_token');location.reload()};
function renderNav(){document.getElementById('nav').innerHTML=tabs.map(([id,n])=>`<button class="navbtn px-4 py-2 rounded-lg whitespace-nowrap text-sm" data-tab="${id}" onclick="showTab('${id}')">${n}</button>`).join('')}
function showTab(id){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));({dashboard:dashboard,inventory:inventory,stock:stock,audit:audit,history:history})[id]()}
function refresh(){return call('getAppData').then(d=>{data=d;document.getElementById('who').innerHTML=`<b>${esc(d.user.Full_Name)}</b><br>${esc(d.user.Branch)} · ${esc(d.user.Role)}`})}
function panel(title,content,extra=''){document.getElementById('view').innerHTML=`<div class="flex justify-between items-center mb-4"><div><h1 class="text-2xl font-bold">${title}</h1><p class="text-sm text-slate-500 mt-1">Spare parts and service operations</p></div>${extra}</div>${content}`}
function dashboard(){
  const p=data.parts,good=p.filter(x=>x.Part_Condition==='Good').length,bad=p.length-good,low=p.filter(x=>+x.Current_Stock<=+x.Min_Stock);
  const summary=data.auditSummary||{total:data.audits.length,partsAudited:data.audits.length,matches:data.audits.filter(a=>a.Status==='MATCH').length,variances:data.audits.filter(a=>a.Status==='VARIANCE').length,systemStock:0,actualCount:0,netVariance:0,absoluteVariance:0,recentVariances:[],latestByPart:data.audits};
  const systemStock=Number(summary.systemStock||0),actualCount=Number(summary.actualCount||0),netVariance=Number(summary.netVariance||0),absoluteVariance=Number(summary.absoluteVariance||0),netClass=netVariance===0?'text-green-700':netVariance>0?'text-amber-700':'text-red-600',netText=(netVariance>0?'+':'')+netVariance.toLocaleString('th-TH');
  const value=user.Role==='Admin'?`<div class="card p-5"><div class="text-sm text-slate-500">Stock value (matched THB prices)</div><div class="text-2xl font-bold mt-2">${Number(data.totalValue||0).toLocaleString('th-TH',{style:'currency',currency:'THB'})}</div></div>`:'';
  const detailRows=summary.latestByPart||data.audits||[],details=`<details class="card p-4 mt-4"><summary class="cursor-pointer font-bold">Detail: latest count by Part code (${summary.partsAudited||0} parts)</summary><div class="mt-3">${detailRows.length?table(['Date','Part code','Part name','Google Sheets stock','Actual scanned','Difference','Status','Staff'],detailRows.map(a=>[a.Date,a.Part_No,a.Part_Name,a.System_Stock,a.Actual_Count,a.Variance,a.Status,a.Auditor])):'<p class="text-slate-500">ยังไม่มีผลนับสต็อก</p>'}</div></details>`;  let daily={};data.transactions.filter(t=>t.Type==='OUT').forEach(t=>{let d=String(t.Timestamp||'').slice(0,10);daily[d]=(daily[d]||0)+Number(t.Qty)});
  panel('Dashboard',`<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-5"><div class="card p-5"><div class="text-sm text-slate-500">Part records</div><div class="text-2xl font-bold mt-2">${p.length}</div></div><div class="card p-5"><div class="text-sm text-slate-500">Good parts</div><div class="text-2xl font-bold mt-2">${good}</div></div><div class="card p-5"><div class="text-sm text-slate-500">Defective / claim</div><div class="text-2xl font-bold mt-2">${bad}</div></div><div class="card p-5"><div class="text-sm text-slate-500">At or below minimum</div><div class="text-2xl font-bold mt-2">${low.length}</div></div>${value}</div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-5"><div class="card p-5"><div class="text-sm text-slate-500">Part codes compared (latest count)</div><div class="text-2xl font-bold mt-2">${Number(summary.partsAudited||0).toLocaleString('th-TH')}</div><div class="text-xs text-green-700 mt-1">Matched: ${Number(summary.matches||0).toLocaleString('th-TH')}</div></div><div class="card p-5"><div class="text-sm text-slate-500">Google Sheets stock at audit</div><div class="text-2xl font-bold mt-2">${systemStock.toLocaleString('th-TH')} ชิ้น</div></div><div class="card p-5"><div class="text-sm text-slate-500">Actual scanned total</div><div class="text-2xl font-bold mt-2">${actualCount.toLocaleString('th-TH')} ชิ้น</div></div><div class="card p-5"><div class="text-sm text-slate-500">Net variance (count − system)</div><div class="text-2xl font-bold mt-2 ${netClass}">${netText} ชิ้น</div></div><div class="card p-5"><div class="text-sm text-slate-500">Total absolute variance</div><div class="text-2xl font-bold mt-2 ${absoluteVariance?'text-red-600':'text-green-700'}">${absoluteVariance.toLocaleString('th-TH')} ชิ้น</div></div><div class="card p-5"><div class="text-sm text-slate-500">Part codes needing review</div><div class="text-2xl font-bold mt-2 ${summary.variances?'text-red-600':'text-green-700'}">${Number(summary.variances||0).toLocaleString('th-TH')}</div></div></div><p class="text-xs text-slate-500 mb-4">ยอดระบบเป็นค่าที่บันทึกไว้ ณ เวลายืนยันผลนับ; Dashboard ใช้ผลนับล่าสุดของแต่ละ Part code และรายละเอียดราย Part อยู่ในหัวข้อ Detail</p><details class="card p-4 mb-4"><summary class="cursor-pointer font-bold">Detail: low-stock parts (${low.length})</summary><div class="mt-3">${table(['Part code','Part name','Stock','Min','Bin'],low.map(x=>[x.Part_No,x.Part_Name,x.Current_Stock,x.Min_Stock,x.Bin_Location]))}</div></details>${details}<div class="grid lg:grid-cols-2 gap-4 mt-4"><div class="card p-5"><h2 class="font-bold mb-3">Daily repair issues</h2><canvas id="chart" height="140"></canvas></div><div class="card p-5"><h2 class="font-bold mb-3">Inventory access</h2><p class="text-sm text-slate-600">Staff can view Parts Inventory and use Stock Audit to scan a part code, enter its physical count, and save the result.</p></div></div>`,user.Role==='Admin'?'<div class="flex flex-wrap gap-2"><button class="btn muted" onclick="manageUsers()">Manage users</button><button class="btn danger" onclick="manageRecords()">Data cleanup</button></div>':'');
  const labels=Object.keys(daily).sort();chart?.destroy();chart=new Chart(document.getElementById('chart'),{type:'bar',data:{labels,datasets:[{label:'Qty issued',data:labels.map(x=>daily[x]),backgroundColor:'#4567dc',borderRadius:5}]},options:{responsive:true,plugins:{legend:{display:false}}}})
}
async function manageUsers(){
  try{
    const users=await call('getUsers');
    const result=await Swal.fire({title:'User management',html:`<div class="text-left max-h-52 overflow-auto">${users.map(u=>`<div class="border-b py-2 flex justify-between gap-2"><span><b>${esc(u.Username)}</b> · ${esc(u.Full_Name)}<br><small>${esc(u.Role)} · ${esc(u.Branch)}</small></span>${u.Username!==user.Username?`<button type="button" class="text-red-600" data-delete-user="${esc(u.Username)}">Delete</button>`:''}</div>`).join('')}</div>`,showDenyButton:true,denyButtonText:'Add user',confirmButtonText:'Done',showCancelButton:true,cancelButtonText:'Close',didOpen:()=>document.querySelectorAll('[data-delete-user]').forEach(button=>button.addEventListener('click',()=>{window.deleteTarget=button.dataset.deleteUser;Swal.clickConfirm()}))});
    if(result.isDenied){
      const {value:v}=await Swal.fire({title:'Add user',html:'<input id="nu" class="swal2-input" placeholder="Username"><input id="np" type="password" class="swal2-input" placeholder="Password"><input id="nn" class="swal2-input" placeholder="Full name"><select id="nr" class="swal2-input"><option>Staff</option><option>Admin</option></select><input id="nb" class="swal2-input" placeholder="Branch">',showCancelButton:true,preConfirm:()=>({Username:document.getElementById('nu').value,Password:document.getElementById('np').value,Full_Name:document.getElementById('nn').value,Role:document.getElementById('nr').value,Branch:document.getElementById('nb').value})});
      if(v){await call('saveUser',v);Swal.fire('Created','User added.','success')}
    }else if(result.isConfirmed&&window.deleteTarget){const target=window.deleteTarget;window.deleteTarget=null;await call('deleteUser',target);Swal.fire('Deleted','User removed.','success')}
  }catch(e){alertErr(e)}
}
async function manageRecords(){
  if(user.Role!=='Admin'){alertErr(new Error('Admin permission required.'));return}
  try{
    const records=await call('getAdminRecords');
    const choices={audits:records.audits||[],transactions:records.transactions||[],parts:data.parts||[]};
    const labels={audits:'Stock-Audit records',transactions:'Transaction history (history only; stock is unchanged)',parts:'Inventory parts (linked price is removed too)'};
    const render=kind=>{const list=choices[kind]||[];const rows=list.map(x=>{const id=kind==='audits'?x.Audit_ID:kind==='transactions'?x.Tx_ID:x.Part_No;const title=kind==='audits'?`${x.Part_No} · ${x.Part_Name} · counted ${x.Actual_Count} · ${x.Status}`:kind==='transactions'?`${x.Type} · ${x.Part_No} · qty ${x.Qty} · ${x.Timestamp}`:`${x.Part_No} · ${x.Part_Name} · stock ${x.Current_Stock}`;return `<label class="admin-delete-row"><input type="checkbox" value="${esc(id)}"><span>${esc(title)}</span></label>`}).join('');return `<div class="mb-2 text-sm text-slate-600">Showing latest ${list.length} rows.</div><div class="admin-delete-list">${rows||'<p class="p-4 text-slate-500">No records</p>'}</div>`};
    const result=await Swal.fire({title:'Admin · Data cleanup',width:760,html:`<p class="text-left text-sm text-red-700 mb-3">เลือกเฉพาะรายการที่ผิดพลาด การลบแล้วกู้คืนไม่ได้ การลบประวัติธุรกรรมจะไม่เปลี่ยนยอดคงคลัง</p><select id="cleanupType" class="swal2-select w-full"><option value="audits">${labels.audits}</option><option value="transactions">${labels.transactions}</option><option value="parts">${labels.parts}</option></select><div id="cleanupRows" class="text-left mt-3">${render('audits')}</div>`,showCancelButton:true,confirmButtonText:'Delete selected',confirmButtonColor:'#b91c1c',cancelButtonText:'Cancel',didOpen:()=>document.getElementById('cleanupType').addEventListener('change',e=>document.getElementById('cleanupRows').innerHTML=render(e.target.value)),preConfirm:()=>{const ids=[...document.querySelectorAll('#cleanupRows input[type=checkbox]:checked')].map(x=>x.value);if(!ids.length){Swal.showValidationMessage('กรุณาเลือกอย่างน้อย 1 รายการ');return false}return {kind:document.getElementById('cleanupType').value,ids}}});
    if(!result.isConfirmed)return;
    const {kind,ids}=result.value;const confirm=await Swal.fire({icon:'warning',title:`ยืนยันลบ ${ids.length} รายการ?`,text:kind==='transactions'?'ลบเฉพาะประวัติ ไม่ปรับยอดสต็อก':kind==='parts'?'ลบรายการอะไหล่และราคาใน Parts_Price ด้วย':'ลบประวัติ Stock-Audit',showCancelButton:true,confirmButtonText:'ยืนยันลบ',confirmButtonColor:'#b91c1c',cancelButtonText:'กลับไปตรวจ'});if(!confirm.isConfirmed)return;
    for(const id of ids){if(kind==='audits')await call('deleteAuditRecord',id);else if(kind==='transactions')await call('deleteTransactionRecord',id);else await call('deletePart',id)}
    await refresh();dashboard();await Swal.fire({icon:'success',title:'ลบข้อมูลแล้ว',text:`ลบสำเร็จ ${ids.length} รายการ`});
  }catch(e){alertErr(e)}
}
function table(head,rows){return `<div class="tablewrap"><table class="w-full text-sm"><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="text-slate-400">No records</td></tr>`}</tbody></table></div>`}
function inventory(){const admin=user.Role==='Admin';panel('Parts Inventory',`<div class="card p-4 mb-4"><div class="grid sm:grid-cols-3 gap-3"><input id="q" class="field" placeholder="Search part, name or model" oninput="filterParts()"><select id="filter" class="field" onchange="filterParts()"><option value="">All conditions</option><option>Good</option><option>Defective</option><option>Low Stock</option></select><div class="flex gap-2"><button class="btn muted" onclick="scan('q')">▣ Scan</button>${admin?'<button class="btn primary" onclick="partForm()">+ Add part</button>':''}</div></div></div><div class="card p-2" id="partsTable"></div>`);filterParts()}
function filterParts(){
  const box=document.getElementById('partsTable');
  if(!box)return;
  const q=(document.getElementById('q')?.value||'').toLowerCase();
  const f=document.getElementById('filter')?.value||'';
  const parts=data.parts.filter(p=>[p.Part_No,p.Part_Name,p.Device_Model].join(' ').toLowerCase().includes(q)&&(!f||(f==='Low Stock'?+p.Current_Stock<=+p.Min_Stock:p.Part_Condition===f)));
  const admin=user.Role==='Admin';
  const heads=['Part No.','Part name','Device model','Type','Condition','Stock','Min','Bin',...(admin?['Unit cost','Currency','Price match','Actions']:[])];
  const body=parts.map(p=>{
    const values=[p.Part_No,p.Part_Name,p.Device_Model,p.Part_Type,p.Part_Condition,p.Current_Stock,p.Min_Stock,p.Bin_Location,...(admin?[p.Unit_Cost,p.Price_Currency,p.Price_Matched?'Matched':'Not found']:[])];
    const cells=values.map(value=>`<td>${esc(value)}</td>`).join('');
    const actions=admin?`<td><button type="button" class="text-blue-700" data-edit-part="${esc(p.Part_No)}">Edit</button> <button type="button" class="text-red-600" data-delete-part="${esc(p.Part_No)}">Delete</button></td>`:'';
    return `<tr>${cells}${actions}</tr>`;
  }).join('');
  box.innerHTML=`<div class="tablewrap"><table class="w-full text-sm"><thead><tr>${heads.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${heads.length}" class="p-4 text-slate-400">No matching parts</td></tr>`}</tbody></table></div>`;
  box.querySelectorAll('[data-edit-part]').forEach(button=>button.addEventListener('click',()=>editPart(button.dataset.editPart)));
  box.querySelectorAll('[data-delete-part]').forEach(button=>button.addEventListener('click',()=>delPart(button.dataset.deletePart)));
}

mt-4 p-3 md:p-4 rounded-xl border border-blue-200 bg-blue-50" aria-live="polite"><div class="rounded-lg bg-white p-3"><div class="text-xs md:text-sm text-slate-500">รหัส Part ไม่ซ้ำ</div><div class="mt-1 text-2xl md:text-3xl font-extrabold text-slate-800"><span id="auditQueuePartCount">0</span> <span class="text-base font-semibold">Part</span></div></div><div class="rounded-lg bg-white p-3"><div class="text-xs md:text-sm text-slate-500">ยอดชิ้นรวมที่รอยืนยัน</div><div class="mt-1 text-2xl md:text-3xl font-extrabold text-blue-700"><span id="auditQueuePieceCount">0</span> <span class="text-base font-semibold">ชิ้น</span></div></div></div><p class="text-xs text-slate-500 mt-2">ยอดรวมคำนวณจากรายการทั้งหมดในคิว และจะอัปเดตเมื่อสแกน แก้จำนวน กด +1 หรือลบ</p><div id="auditPendingList" class="mt-3"><p class="text-slate-500 py-3">รายการที่สแกนจะปรากฏตรงนี้</p></div><button id="auditConfirmBtn" type="button" class="btn primary audit-confirm-btn mt-4" onclick="submitAuditBatch()" disabled>ยืนยันและบันทึกทั้งหมด</button></section>`);

function updateAuditPending(){const list=document.getElementById('auditPendingList');if(!list)return;const items=pendingAuditItems(),total=items.reduce((s,x)=>s+x.count,0),partCount=document.getElementById('auditQueuePartCount'),pieceCount=document.getElementById('auditQueuePieceCount'),button=document.getElementById('auditConfirmBtn');if(partCount)partCount.textContent=String(items.length);if(pieceCount)pieceCount.textContent=String(total);if(button){button.disabled=!items.length;button.textContent=`ยืนยันและบันทึกทั้งหมด (${items.length} Part / ${total} ชิ้น)`}const scannerPending=document.getElementById('scannerPending');if(scannerPending)scannerPending.innerHTML=items.length?`<div class="font-bold mb-1">คิวรอยืนยัน: ${items.length} Part · ${total} ชิ้น</div>${items.slice(-5).reverse().map(x=>`<div class="truncate">${esc(x.part.Part_No)} · ${esc(x.part.Part_Name)} × ${x.count}</div>`).join('')}${items.length>5?`<small>แสดง 5 รายการล่าสุดจากทั้งหมด ${items.length}</small>`:''}`:'คิวยังว่าง — เริ่มสแกนสินค้าได้เลย';list.innerHTML=items.length?items.map(x=>`<div class="audit-pending-row"><span><b>${esc(x.part.Part_No)}</b> · ${esc(x.part.Part_Name)}<small>นับแล้ว ${x.count} ชิ้น</small></span><div class="audit-pending-actions"><button type="button" class="btn muted audit-pending-add" data-pending-add="${esc(x.part.Part_No)}" aria-label="เพิ่มหนึ่งชิ้น ${esc(x.part.Part_No)}">+1</button><button type="button" class="btn muted audit-pending-edit" data-pending-edit="${esc(x.part.Part_No)}">แก้จำนวน</button><button type="button" class="btn danger audit-remove-btn" data-remove-audit="${esc(x.part.Part_No)}">ลบ</button></div></div>`).join(''):'<p class="text-slate-500 py-3">ยังไม่มีรายการ — สแกนบาร์โค้ด/QR เพื่อเพิ่ม Part เข้าคิว</p>';list.querySelectorAll('[data-pending-edit]').forEach(b=>b.addEventListener('click',async()=>{const code=b.dataset.pendingEdit,{value,isConfirmed}=await Swal.fire({title:`แก้จำนวน ${code}`,input:'number',inputValue:Number(auditCounts[code]||0),inputAttributes:{min:'0',step:'1',inputmode:'numeric'},showCancelButton:true,confirmButtonText:'บันทึกจำนวน',cancelButtonText:'ยกเลิก'});if(!isConfirmed)return;const count=Number(value);if(!Number.isInteger(count)||count<0){await Swal.fire('จำนวนไม่ถูกต้อง','กรอกจำนวนเต็มตั้งแต่ 0 ขึ้นไป','warning');return}auditCounts[code]=count;updateAuditPending()}));list.querySelectorAll('[data-pending-add]').forEach(b=>b.addEventListener('click',()=>{const code=b.dataset.pendingAdd;auditCounts[code]=Number(auditCounts[code]||0)+1;updateAuditPending()}));list.querySelectorAll('[data-remove-audit]').forEach(b=>b.addEventListener('click',()=>{delete auditCounts[b.dataset.removeAudit];updateAuditPending()}))}async function clearPendingAudit(){if(!Object.keys(auditCounts).length)return;const r=await Swal.fire({icon:'warning',title:'ล้างรายการที่รอยืนยัน?',text:'รายการที่ยังไม่บันทึกทั้งหมดจะถูกนำออก',showCancelButton:true,confirmButtonText:'ล้างรายการ',confirmButtonColor:'#b91c1c',cancelButtonText:'ยกเลิก'});if(!r.isConfirmed)return;Object.keys(auditCounts).forEach(k=>delete auditCounts[k]);updateAuditPending();const s=document.getElementById('auditScanStatus');if(s)s.textContent='ล้างรายการแล้ว พร้อมเริ่มสแกนชุดใหม่'}
async function submitAuditBatch(){const items=pendingAuditItems().map(x=>({Part_No:x.part.Part_No,Actual_Count:x.count}));if(!items.length){await Swal.fire('ยังไม่มีรายการ','สแกน QR อย่างน้อยหนึ่งรายการก่อนยืนยัน','info');return}if(scannerStarted)await stopScan();const total=items.reduce((s,x)=>s+x.Actual_Count,0),preview=items.slice(0,12).map(x=>`${esc(x.Part_No)} — ${x.Actual_Count} ชิ้น`).join('<br>')+(items.length>12?`<br>และอีก ${items.length-12} Part`:''),review=await Swal.fire({title:'ยืนยันบันทึก Stock Audit?',html:`<div class="grid grid-cols-2 gap-3 mb-4"><div class="rounded-xl bg-blue-50 p-3 text-center"><div class="text-xs text-slate-600">รหัส Part ไม่ซ้ำ</div><div class="text-2xl font-bold">${items.length} Part</div></div><div class="rounded-xl bg-blue-50 p-3 text-center"><div class="text-xs text-slate-600">ยอดชิ้นรวมที่จะบันทึก</div><div class="text-2xl font-bold text-blue-700">${total} ชิ้น</div></div></div><div class="text-left">รายการที่จะเขียนลงชีต <b>Stock-Audit</b>:</div><div class="text-left max-h-48 overflow-auto mt-3">${preview}</div>`,icon:'question',showCancelButton:true,confirmButtonText:'ยืนยันและบันทึก',cancelButtonText:'กลับไปตรวจ'});if(!review.isConfirmed)return;try{const result=await call('saveAuditBatch',items);Object.keys(auditCounts).forEach(k=>delete auditCounts[k]);await refresh();audit();const entries=result.entries||[],matches=entries.filter(x=>x.Status==='MATCH').length,variances=entries.length-matches;await Swal.fire({icon:variances?'warning':'success',title:'บันทึก Stock Audit แล้ว',text:`บันทึก ${result.saved} Part (${total} ชิ้น) ลง Stock-Audit · ตรง ${matches} · ผลต่าง ${variances}`,confirmButtonText:'เรียบร้อย'})}catch(e){alertErr(e)}}

function flashScanToast(code,name,count,label='สแกนสำเร็จ'){const el=document.getElementById('scanToast');if(!el)return;el.classList.remove('is-error');el.style.background='#15803d';el.innerHTML=`<b>${esc(label)}</b><span>${esc(code)} · ${esc(name)}</span><small>ยอดสะสม ${count} ชิ้น</small>`;el.classList.add('show');clearTimeout(window.scanToastTimer);window.scanToastTimer=setTimeout(()=>el.classList.remove('show'),1900)}

function recordAuditPartCode(raw,source='camera'){const scanned=String(raw??'').trim();if(!scanned)return false;const part=data.parts.find(p=>String(p.Part_No).trim().toUpperCase()===scanned.toUpperCase()),status=document.getElementById('auditScanStatus');if(!part){flashUnknownScanToast(scanned);if(status)status.textContent=`ไม่พบรหัสอะไหล่ ${scanned} — ตรวจสอบรหัสหรือเพิ่ม Part ใน Inventory`;const card=document.getElementById('auditScanResult');if(card)card.innerHTML=`<div class="text-sm text-red-700">ไม่พบรหัสอะไหล่ในระบบ</div><div class="mt-2 text-xl font-bold">Part code: ${esc(scanned)}</div><div class="mt-1 text-sm">ตรวจรหัสใน Parts Inventory ก่อน ระบบยังไม่เพิ่มรหัสนี้เข้าคิว</div>`;return false}const code=String(part.Part_No).trim();auditCounts[code]=Number(auditCounts[code]||0)+1;updateAuditPending();const count=Number(auditCounts[code]),card=document.getElementById('auditScanResult');if(card)card.innerHTML=`<div class="text-sm font-semibold text-blue-800">เพิ่มเข้าคิวแล้ว · 1 ชิ้น</div><div class="mt-2 text-2xl font-bold">Part code: ${esc(code)}</div><div class="mt-1 text-lg">${esc(part.Part_Name)}</div><div class="mt-3 rounded-lg bg-white p-3"><div class="text-xs text-slate-500">จำนวนที่นับสะสม</div><div class="text-2xl font-bold text-blue-700">${count} ชิ้น</div></div><div class="mt-3 text-sm text-slate-600">รายการยังไม่ถูกบันทึกถาวรจนกด ยืนยันและบันทึกทั้งหมด</div>`;if(status)status.textContent=source==='entry'?`เพิ่ม ${code} เข้าคิวแล้ว — จำนวนสะสม ${count} ชิ้น`:`สแกน ${code} สำเร็จ — นับรวม ${count} ชิ้น`;flashScanToast(code,part.Part_Name,count,source==='entry'?'เพิ่มเข้าคิวแล้ว':'สแกนสำเร็จ');return true}
function handleAuditCodeSubmit(event){event.preventDefault();const input=document.getElementById('auditCodeInput');if(!input)return;const raw=input.value;if(!String(raw||'').trim()){const status=document.getElementById('auditScanStatus');if(status)status.textContent='กรุณายิงบาร์โค้ดหรือพิมพ์ Part code ก่อนเพิ่ม';input.focus();return}if(recordAuditPartCode(raw,'entry')){input.value='';input.focus()}else{input.focus();input.select()}}async function scan(target){
  if(scannerStarting||scannerStarted)return;scanTarget=target;if(target==='auditCount'){document.getElementById('auditCodeInput')?.blur();auditCodeArmed=true;auditLastAcceptedAt=0;auditMissCount=0}const box=document.getElementById('scanner');box.classList.remove('hidden');box.classList.add('flex');scannerStarting=true;scannerStarted=false;
  try{
    if(window.qrScanner){try{await window.qrScanner.clear()}catch(_){}window.qrScanner=null}
    window.qrScanner=new Html5Qrcode('reader');
    await window.qrScanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.floor(Math.min(w*.92,480)),height:Math.floor(Math.min(h*.62,300))})},txt=>{
      if(scanTarget==='auditCount'){
        let code=String(txt||'').trim();if(!code)return;if(!auditCodeArmed){if(code.toUpperCase()!==String(lastAuditScanCode).toUpperCase()&&Date.now()-auditLastAcceptedAt>=900)auditCodeArmed=true;else{auditMissCount=0;return}}
        lastAuditScanCode=code;auditCodeArmed=false;auditLastAcceptedAt=Date.now();auditMissCount=0;recordAuditPartCode(code,'camera');return;
      }      const el=document.getElementById(scanTarget);if(el){el.value=txt;el.dispatchEvent(new Event('input'));el.dispatchEvent(new Event('change'));if(scanTarget==='q')filterParts();}stopScan()
    },()=>{if(scanTarget==='auditCount'&&!auditCodeArmed){auditMissCount++;if(auditMissCount>=8&&Date.now()-auditLastAcceptedAt>=1100){auditCodeArmed=true;auditMissCount=0;const s=document.getElementById('auditScanStatus');if(s)s.textContent='พร้อมอ่านรหัสถัดไป — นำ QR ใหม่เข้ากรอบกล้อง'}}});scannerStarted=true
  }catch(e){const detail=String(e&&e.message||e);await Swal.fire({icon:'error',title:'Camera permission unavailable',text:detail.includes('NotAllowedError')||detail.toLowerCase().includes('permission')?'The current page or embedded frame is not allowed to use the camera. Open the deployed Web App directly in a browser tab, then allow camera access in the browser/site settings. You can still type or paste the barcode manually.':detail});await disposeScanner()}finally{scannerStarting=false}
}
async function disposeScanner(){const scanner=window.qrScanner;window.qrScanner=null;if(scanner&&scannerStarted){try{await scanner.stop()}catch(e){console.warn('Scanner stop:',e)}}scannerStarted=false;if(scanner){try{scanner.clear()}catch(e){console.warn('Scanner clear:',e)}}const box=document.getElementById('scanner');box.classList.add('hidden');box.classList.remove('flex')}
function stopScan(){if(scannerStarting&&!scannerStarted)return;return disposeScanner()}
if(token)start();
